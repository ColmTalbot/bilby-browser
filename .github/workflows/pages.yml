# Build the site and deploy it to GitHub Pages.
#
# Nothing the site serves from examples/ or wheels/ is stored in the
# repository: the examples and the bilby wheel come from the commit pinned in
# bilby-commit.txt, igwn-segments is rebuilt from its sdist, and the LALSuite
# wheel is downloaded from the GitLab job pinned in lalsuite-wheel.json, and
# the PyPI wheels pinned in packages.lock.json are served by the site too.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch bilby (examples and wheel) at the pinned commit
        run: scripts/fetch-bilby.sh

      - name: Build the pure-Python igwn-segments wheel
        run: scripts/build-igwn-segments.sh

      - name: Download the pinned LALSuite wheel
        run: scripts/fetch-lalsuite.sh

      - name: Download the PyPI wheels pinned in packages.lock.json
        run: python3 scripts/fetch-pypi-wheels.py

      - name: Write the example manifest, wheel index and licences page
        run: |
          python3 scripts/make_manifest.py
          python3 scripts/write_wheel_index.py
          python3 scripts/write_licenses.py

      - name: Assemble the site
        run: |
          mkdir _site
          cp -r index.html licenses.html app.js worker.js py wheels examples licenses _site/
          ls -la _site _site/wheels

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
