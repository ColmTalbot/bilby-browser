# Build the site and deploy it to GitHub Pages.
#
# examples/ and examples/manifest.json are generated here from the bilby
# commit pinned in bilby-commit.txt; they are not stored in the repository.
# The wheels in wheels/ are committed for now (see LOCAL-ONLY.md); their
# index.json is generated.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and adapt the bilby examples
        run: scripts/fetch-bilby.sh

      - name: Write the example manifest and wheel index
        run: |
          python3 scripts/make_manifest.py
          python3 scripts/write_wheel_index.py

      - name: Assemble the site
        run: |
          mkdir _site
          cp -r index.html app.js worker.js py wheels examples _site/
          ls -la _site _site/wheels

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
