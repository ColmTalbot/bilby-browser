<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bilby</title>
<link rel="icon" href="assets/bilby-logo.jpg">
<script>try { const t = localStorage.getItem("bilby-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<style>
  :root {
    --bg: #ffffff; --fg: #1d1d1f; --muted: #6b6b70; --panel: #f5f5f7;
    --border: #d8d8dc; --accent: #2457c5; --ok: #1d7f3a; --err: #b3261e;
    --code-bg: #fbfbfc; --warn: #8a5a00; --warn-bg: #fff4d6; --warn-border: #e0a800;
    --syn-keyword: #8b2fc9; --syn-string: #1a7f37; --syn-number: #b35900; --syn-comment: #6e7781;
    --syn-def: #0550ae; --syn-call: #24292f; --syn-builtin: #953800;
    --active-line: rgba(36, 87, 197, 0.06); --selection: rgba(36, 87, 197, 0.22);
    --error-line: rgba(179, 38, 30, 0.14);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  /* dark: from the system setting unless the theme button picked light, or
     picked explicitly (the two blocks must stay identical) */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #161618; --fg: #ececf0; --muted: #9a9aa2; --panel: #202024;
      --border: #34343a; --accent: #7aa2ff; --ok: #5cc27a; --err: #ff7b72;
      --code-bg: #1b1b1e; --warn: #ffcc66; --warn-bg: #3a2e12; --warn-border: #c99400;
      --syn-keyword: #d2a8ff; --syn-string: #7ee787; --syn-number: #ffa657; --syn-comment: #8b949e;
      --syn-def: #79c0ff; --syn-call: #e6edf3; --syn-builtin: #ffa198;
      --active-line: rgba(122, 162, 255, 0.07); --selection: rgba(122, 162, 255, 0.28);
      --error-line: rgba(255, 123, 114, 0.18);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #161618; --fg: #ececf0; --muted: #9a9aa2; --panel: #202024;
    --border: #34343a; --accent: #7aa2ff; --ok: #5cc27a; --err: #ff7b72;
    --code-bg: #1b1b1e; --warn: #ffcc66; --warn-bg: #3a2e12; --warn-border: #c99400;
    --syn-keyword: #d2a8ff; --syn-string: #7ee787; --syn-number: #ffa657; --syn-comment: #8b949e;
    --syn-def: #79c0ff; --syn-call: #e6edf3; --syn-builtin: #ffa198;
    --active-line: rgba(122, 162, 255, 0.07); --selection: rgba(122, 162, 255, 0.28);
    --error-line: rgba(255, 123, 114, 0.18);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--border);
           display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  header h1 img { border-radius: 6px; }
  body.tree-hidden nav { display: none; }
  body.tree-hidden main { grid-template-columns: minmax(0, var(--left, 1fr)) minmax(0, var(--right, 1fr)); }
  #status { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  /* download progress for start-up and installs, along the header's bottom edge */
  header { position: relative; }
  #progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; overflow: hidden;
              opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  #progress.active { opacity: 1; }
  #progress .fill { height: 100%; width: 0; transition: width 0.2s ease-out;
                    background: linear-gradient(90deg, var(--accent) 0%, var(--accent) 40%,
                      color-mix(in srgb, var(--accent) 45%, white) 50%, var(--accent) 60%, var(--accent) 100%)
                      0 0 / 300% 100%; animation: progress-sheen 1.6s linear infinite; }
  /* the sheen keeps moving while the worker is busy setting a package up and
     cannot report (the amount only updates between those steps) */
  @keyframes progress-sheen { from { background-position: 100% 0; } to { background-position: 0 0; } }
  #progress.unknown .fill { width: 30%; animation: progress-slide 1.2s ease-in-out infinite; }
  @keyframes progress-slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  @media (prefers-reduced-motion: reduce) {
    #progress .fill { animation: none; }
    #progress.unknown .fill { width: 100%; opacity: 0.5; }
  }
  header .links { margin-left: auto; display: flex; gap: 14px; align-items: center; }
  header .links a { color: var(--muted); }
  .icon-button { padding: 5px; line-height: 0; color: var(--muted); background: transparent;
                 border-color: transparent; }
  .icon-button:hover { color: var(--fg); background: var(--panel); border-color: var(--border); }
  .icon-button svg { width: 18px; height: 18px; }
  #theme { font-size: 12px; padding: 4px 8px; line-height: 1.2; color: var(--muted); }
  #status.ok { color: var(--ok); } #status.err { color: var(--err); }
  main { display: grid;
         grid-template-columns: 260px minmax(0, var(--left, 1fr)) minmax(0, var(--right, 1fr));
         gap: 16px; padding: 12px 16px; flex: 1; min-height: 0; }
  @media (max-width: 1100px) {
    body { height: auto; }
    main { grid-template-columns: 220px minmax(0, 1fr); }
    body.tree-hidden main { grid-template-columns: minmax(0, 1fr); }
    #output-pane { grid-column: 1 / -1; }
    #divider { display: none; }
  }
  #scrim { display: none; }

  nav { overflow: auto; font-size: 13px; border-right: 1px solid var(--border);
        padding-right: 8px; display: flex; flex-direction: column; gap: 6px; scrollbar-width: thin; }
  #search { font: inherit; font-size: 13px; padding: 5px 8px; border-radius: 6px; width: 100%;
            border: 1px solid var(--border); background: var(--code-bg); color: var(--fg);
            position: sticky; top: 0; }
  #search:focus { outline: none; border-color: var(--accent); }
  #no-match { color: var(--muted); font-size: 12px; padding: 3px 6px; }
  nav .hidden { display: none; }
  /* example tree: top-level folders as section labels, chevrons that turn,
     indent guides, and a tinted (not filled) current example */
  nav summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 6px;
                padding: 4px 6px; border-radius: 6px; font-weight: 500; color: var(--fg);
                user-select: none; }
  nav summary::-webkit-details-marker { display: none; }
  nav summary::before { content: ""; flex: none; width: 5px; height: 5px; margin: 0 2px 0 1px;
                        border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted);
                        transform: rotate(-45deg); transition: transform 0.15s ease; }
  nav details[open] > summary::before { transform: rotate(45deg) translate(-1px, -1px); }
  nav summary:hover { background: var(--panel); }
  nav summary:focus-visible, nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  #tree > div > details { margin-top: 10px; }
  #tree > div > details:first-child { margin-top: 2px; }
  #tree > div > details > summary { font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
                                    text-transform: uppercase; color: var(--muted); }
  #tree > div > details > summary:hover { color: var(--fg); }
  nav .children { margin-left: 10px; padding-left: 4px; border-left: 1px solid var(--border); }
  #tree > div > details > .children { margin-left: 0; padding-left: 0; border-left: none; }
  nav a { display: block; padding: 4px 8px 4px 20px; margin: 1px 0; color: var(--fg); text-decoration: none;
          border-radius: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
          font-size: 13px; transition: background 0.1s; }
  nav a:hover { background: var(--panel); }
  nav a.active { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent);
                 font-weight: 600; }
  nav a.unsupported { color: var(--muted); text-decoration: line-through;
                      text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
  nav a.partial::after { content: " ◐"; color: var(--muted); }
  /* open and close smoothly where supported (Chromium); instant elsewhere */
  @supports selector(::details-content) {
    :root { interpolate-size: allow-keywords; }
    nav details::details-content { height: 0; overflow: clip;
      transition: height 0.18s ease, content-visibility 0.18s allow-discrete; }
    nav details[open]::details-content { height: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    nav summary::before, nav details::details-content { transition: none; }
  }
  #notes p { margin: 0; font-size: 12px; padding: 6px 10px; border-radius: 6px;
             background: var(--panel); }
  #notes p + p { margin-top: 4px; }
  #notes .unsupported { color: var(--err); }
  #notes .partial { color: var(--fg); }
  #notes .changes { color: var(--muted); }
  /* test-mode switch and warning colours (body.test-mode while it is on) */
  .toggle { font-size: 13px; display: inline-flex; align-items: center; gap: 6px;
            cursor: pointer; padding: 3px 10px 3px 6px; border-radius: 999px;
            border: 1px solid var(--border); background: var(--panel); user-select: none; }
  .toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
  .toggle .track { width: 28px; height: 16px; border-radius: 8px; background: var(--border);
                   position: relative; transition: background 0.15s; }
  .toggle .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px;
                          height: 12px; border-radius: 50%; background: #fff;
                          transition: transform 0.15s; }
  .toggle input:checked + .track { background: var(--warn-border); }
  .toggle input:checked + .track::after { transform: translateX(12px); }
  .toggle input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
  body.test-mode header { background: var(--warn-bg); border-bottom: 2px solid var(--warn-border); }
  body.test-mode .toggle { border-color: var(--warn-border); color: var(--warn); font-weight: 600; }
  body.test-mode #output { border-color: var(--warn-border); }
  body.test-mode #run { background: var(--warn-border); border-color: var(--warn-border); color: #1d1d1f; }
  #output .run.test { color: var(--warn); }

  .pane { display: flex; flex-direction: column; min-height: 0; gap: 8px; }
  #output-pane { position: relative; }
  /* drag to resize the editor and output panes; sits in the grid gap */
  #divider { position: absolute; left: -12px; top: 0; bottom: 0; width: 8px; cursor: col-resize;
             border-radius: 4px; touch-action: none; }
  #divider:hover, #divider.dragging { background: var(--border); }
  body.resizing { cursor: col-resize; user-select: none; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .toolbar .spacer { flex: 1; }
  #title { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace;
           min-width: 0; flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis;
           white-space: nowrap; }
  .pane > .toolbar { flex-wrap: nowrap; }
  /* the example's docstring, converted to HTML: first paragraph, then more */
  #description { font-size: 13px; line-height: 1.5; color: var(--fg); max-height: 40vh; overflow: auto; }
  #description:empty { display: none; }
  #description p, #description ul, #description pre { margin: 0 0 6px; }
  #description > :last-child, #description .more > :last-child { margin-bottom: 0; }
  #description ul { padding-left: 20px; }
  #description code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
                      background: var(--panel); border: 1px solid var(--border);
                      border-radius: 4px; padding: 0 3px; }
  #description pre code { display: block; padding: 6px 8px; white-space: pre-wrap; }
  #description a { color: var(--accent); }
  #description .more { display: none; }
  #description.expanded .more { display: block; }
  #description .toggle-doc { font-size: 12px; padding: 0; border: none; background: none;
                             color: var(--accent); cursor: pointer; }
  button { font: inherit; font-size: 13px; padding: 6px 10px;
           border: 1px solid var(--border); border-radius: 6px;
           background: var(--panel); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent);
                   color: #fff; font-weight: 600; }
  button:disabled { opacity: 0.5; cursor: default; }
  .hint { font-size: 12px; color: var(--muted); }
  #code { flex: 1; min-height: 320px; min-width: 0; overflow: hidden;
          border: 1px solid var(--border); border-radius: 8px; background: var(--code-bg); }
  #code .cm-editor { height: 100%; }
  #code .cm-editor.cm-focused { outline: none; }
  #code:focus-within { border-color: var(--accent); }
  #output { flex: 1; min-height: 320px; overflow: auto; padding: 12px;
            border: 1px solid var(--border); border-radius: 8px;
            background: var(--panel);
            font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #output pre { margin: 0; white-space: pre-wrap; word-break: break-word; }
  #output .stderr { color: var(--muted); }
  #output .error { color: var(--err); }
  #output .info { color: var(--muted); font-style: italic; }
  #output .run { color: var(--accent); font-weight: 600; cursor: pointer; }
  #output details.run-block { margin-top: 10px; }
  #output details.run-block:first-child { margin-top: 0; }
  #output details.run-block > summary { list-style: none; }
  #output details.run-block > summary::-webkit-details-marker { display: none; }
  #output details.run-block > summary::before { content: "▾ "; color: var(--muted); }
  #output details.run-block:not([open]) > summary::before { content: "▸ "; }
  #output figure { margin: 8px 0; }
  #output img { max-width: 100%; background: #fff; border-radius: 6px; cursor: zoom-in; }
  #output figcaption { font-size: 11px; color: var(--muted); }
  #output figcaption a, #output .info a { color: var(--muted); margin-left: 8px; }
  #lightbox { border: none; padding: 0; background: transparent; max-width: 96vw; max-height: 96vh; }
  #lightbox::backdrop { background: rgba(0, 0, 0, 0.75); }
  #lightbox img { display: block; max-width: 96vw; max-height: 88vh; background: #fff;
                  border-radius: 6px; cursor: zoom-out; }
  #lightbox .bar { display: flex; gap: 12px; justify-content: center; padding-top: 8px; }
  #lightbox .bar a, #lightbox .bar button { color: #fff; font-size: 13px; }
  #lightbox .bar button { background: transparent; border-color: rgba(255, 255, 255, 0.4); }
  /* phones: the example list is a drawer over the page (opened with the
     sidebar button), the header links move into it, toolbars wrap */
  @media (max-width: 700px) {
    header { padding: 8px 12px; gap: 10px; flex-wrap: nowrap; }
    header h1 img { width: 26px; height: 26px; }
    #status { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .toggle { flex: none; }
    main, body.tree-hidden main { grid-template-columns: minmax(0, 1fr); padding: 10px 12px; gap: 12px; }
    nav, body.tree-hidden nav { display: flex; position: fixed; z-index: 30; top: 0; bottom: 0; left: 0;
          width: min(85vw, 320px); padding: 12px; background: var(--bg); border-right: 1px solid var(--border);
          box-shadow: 0 0 24px rgba(0, 0, 0, 0.25); transform: translateX(-105%);
          transition: transform 0.2s ease; visibility: hidden; }
    body.tree-open nav { transform: none; visibility: visible; }
    body.tree-open #scrim { display: block; position: fixed; inset: 0; z-index: 29;
                            background: rgba(0, 0, 0, 0.35); }
    #search { font-size: 16px; } /* smaller text makes iOS zoom in on focus */
    nav a, nav summary { padding-top: 7px; padding-bottom: 7px; }
    nav .links { margin: auto 0 0; padding-top: 12px; border-top: 1px solid var(--border);
                 display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; }
    nav .links a { color: var(--muted); display: inline; padding: 4px 0; margin: 0; text-decoration: underline; }
    .pane > .toolbar { flex-wrap: wrap; }
    #title { flex-basis: 100%; }
    .toolbar .spacer { display: none; }
    .toolbar button { padding: 8px 12px; }
    #run { margin-left: auto; }
    #code { flex: none; height: 60vh; min-height: 260px; }
    #output { min-height: 50vh; }
    #output-pane .hint .long { display: none; }
  }
  @media (max-width: 700px) and (prefers-reduced-motion: reduce) { nav { transition: none; } }
</style>
</head>
<body>
<header>
  <button id="toggle-tree" class="icon-button" aria-controls="tree" aria-expanded="true" title="Hide the example list">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <rect x="2.75" y="3.75" width="14.5" height="12.5" rx="2.5"/><line x1="7.75" y1="4" x2="7.75" y2="16"/>
    </svg>
  </button>
  <h1><img src="assets/bilby-logo.jpg" alt="Bilby" title="Bilby" width="28" height="28"></h1>
  <span id="status">Loading…</span>
  <label class="toggle" title="bilby test mode (--bilby-test-mode): sampling stops after a few iterations (dynesty, nestle) and corner and data plots are skipped. Results are not real posteriors.">
    <input type="checkbox" id="test-mode" role="switch">
    <span class="track" aria-hidden="true"></span>
    <span>Test mode</span>
  </label>
  <span class="links hint">
    <a id="source"></a>
    <a href="https://github.com/ColmTalbot/bilby-browser">Site source</a>
    <a href="licenses.html">Licences</a>
    <button id="theme" title="Colour theme">Theme: auto</button>
  </span>
  <div id="progress" role="progressbar" aria-label="Download progress"><div class="fill"></div></div>
</header>
<main>
  <nav id="tree" aria-label="Examples">
    <input id="search" type="search" placeholder="Search examples" aria-label="Search examples" autocomplete="off">
    <div id="no-match" class="hidden">No matching examples</div>
  </nav>
  <section class="pane">
    <div class="toolbar">
      <span id="title"></span>
      <span class="spacer"></span>
      <button id="download-script" title="Download this script, with your edits">Download</button>
      <button id="new" title="Open a blank editor (kept in this browser)">New</button>
      <button id="reset" title="Discard your edits">Reset</button>
      <button id="stop" disabled>Stop</button>
      <button id="run" class="primary" disabled>Run</button>
    </div>
    <div id="description"></div>
    <div id="notes"></div>
    <div id="code"></div>
  </section>
  <section class="pane" id="output-pane">
    <div id="divider" role="separator" aria-orientation="vertical" aria-label="Resize editor and output" title="Drag to resize; double-click to reset"></div>
    <div class="toolbar">
      <span class="hint">Output<span class="long"> (runs in your browser with Pyodide; one CPU core)</span></span>
      <span class="spacer"></span>
      <button id="download-results" title="Download the files the last run wrote, as a zip" disabled>Results</button>
      <button id="copy" title="Copy all output as text">Copy</button>
      <button id="clear">Clear</button>
    </div>
    <div id="output" aria-live="polite"></div>
  </section>
</main>
<div id="scrim"></div>
<dialog id="lightbox" aria-label="Figure">
  <img alt="">
  <div class="bar"><a download>Download</a><button>Close</button></div>
</dialog>
<!-- ?v=dev becomes the commit hash when deployed, so each deploy bypasses
     cached copies; app.js passes it on to the worker and its fetches -->
<script src="editor.bundle.js?v=dev"></script>
<script src="app.js?v=dev"></script>
</body>
</html>
